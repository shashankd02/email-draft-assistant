name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      STRICT_PROVIDER_MODE: "false"
      APP_ENV: "development"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: email_assistant
          POSTGRES_USER: email_assistant
          POSTGRES_PASSWORD: email_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_assistant -d email_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://email_assistant:email_assistant@localhost:5432/email_assistant
          STRICT_PROVIDER_MODE: "false"
        run: alembic upgrade head

      - name: Compile backend
        run: python -m compileall src

      - name: Run backend tests (unit + integration)
        env:
          DATABASE_URL: postgresql+psycopg://email_assistant:email_assistant@localhost:5432/email_assistant
          STRICT_PROVIDER_MODE: "false"
        run: pytest -q

      - name: Eval smoke (core + adversarial + voice)
        env:
          STRICT_PROVIDER_MODE: "false"
        run: |
          python - <<'PY'
          from src.evaluation.harness import EvaluationHarness
          h = EvaluationHarness()
          for ds in ("core", "adversarial", "voice"):
              result = h.run_eval(ds, user_id="ci-eval", max_cases=1)
              assert result["summary"]["total_cases"] == 1
          print("eval smoke passed")
          PY

      - name: Release gate eval thresholds
        run: python scripts/eval_gate.py

      - name: Install security scan tools
        run: pip install bandit pip-audit

      - name: Security static scan (bandit)
        run: bandit -q -r src

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          # Temporary allowlist for transitive advisories that require major framework migration.
          # TODO: remove ignore list after upgrading FastAPI/Starlette and LangGraph stack.
          pip-audit \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln CVE-2025-65106 \
            --ignore-vuln CVE-2025-68664 \
            --ignore-vuln CVE-2026-26013 \
            --ignore-vuln CVE-2025-64439 \
            --ignore-vuln CVE-2025-67221 \
            --ignore-vuln CVE-2024-47874 \
            --ignore-vuln CVE-2025-54121

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Type check/build
        run: npm run build

      - name: Dependency vulnerability scan (npm audit critical gate)
        run: npm audit --omit=dev --audit-level=critical

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare env files for docker compose
        run: |
          set -euo pipefail
          cp backend/.env.example backend/.env
          cp frontend/.env.local.example frontend/.env.local
          if grep -q '^STRICT_PROVIDER_MODE=' backend/.env; then
            sed -i 's/^STRICT_PROVIDER_MODE=.*/STRICT_PROVIDER_MODE=false/' backend/.env
          else
            echo 'STRICT_PROVIDER_MODE=false' >> backend/.env
          fi
          if grep -q '^APP_ENV=' backend/.env; then
            sed -i 's/^APP_ENV=.*/APP_ENV=development/' backend/.env
          else
            echo 'APP_ENV=development' >> backend/.env
          fi

      - name: Validate compose configuration
        run: docker compose config -q

      - name: Start services
        run: docker compose up --build -d postgres chroma backend frontend

      - name: Apply migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8002/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time" >&2
          exit 1

      - name: Smoke test auth + draft + mcp
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -X POST http://localhost:8002/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"ci-user","role":"user","bootstrap_secret":"dev-bootstrap-secret"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://localhost:8002/api/v1/draft/generate \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"ci-user","prompt":"Draft an email to my engineering manager summarizing today'\''s CI smoke test results and requesting approval to proceed.","intent":"informational","tone":"professional","constraints":{"max_paragraphs":2,"must_include":[],"forbidden":["PII"]},"metadata":{"recipient_role":"internal","language":"en"}}' >/dev/null
          curl -fsS -X GET http://localhost:8002/api/v1/mcp/tools \
            -H "Authorization: Bearer ${TOKEN}" >/dev/null

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Teardown
        if: always()
        run: docker compose down -v || true
