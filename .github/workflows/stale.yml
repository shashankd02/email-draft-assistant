name: Stale Issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale and close inactive items
        uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been inactive for 21 days and is marked stale. Reply to keep it active."
          stale-pr-message: "This PR has been inactive for 14 days and is marked stale. Reply or push updates to keep it active."
          close-issue-message: "Closing stale issue due to inactivity."
          close-pr-message: "Closing stale PR due to inactivity."
          days-before-issue-stale: 21
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
